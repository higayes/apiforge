name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The minimum supported version and the current LTS.
        node: ['22.19.0', '22']
        os: [ubuntu-latest]
        include:
          # Cross-platform confidence: the CLI must behave the same everywhere.
          - node: '22'
            os: windows-latest
          - node: '22'
            os: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # The CLI tests execute the built bundle, so the build must come first.
      - name: Unit and integration tests
        run: pnpm test

      - name: Coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: pnpm test:coverage

      - name: End-to-end smoke test
        run: node scripts/smoke-test.mjs

      - name: Examples
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: pnpm examples

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  package:
    name: Package check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: npm pack (dry run)
        run: pnpm pack:check

      - name: Install-from-tarball test
        run: pnpm exec vitest run packages/cli/tests/packaging.test.ts
        env:
          APIFORGE_TEST_PACK: '1'
