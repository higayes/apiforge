name: Release

# Publishes to npm when a version tag is pushed. Requires the NPM_TOKEN secret.
# Dry-run by default on manual dispatch so a release can be rehearsed.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: Rehearse the release without publishing
        type: boolean
        default: true

# Least privilege: the workflow default is read-only. Each job asks for exactly what
# it needs, and the job that runs project build scripts never holds `contents: write`.
permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $VERSION"
            exit 1
          fi
          echo "Releasing $VERSION"

      - name: Full verification
        run: pnpm verify

      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run
        run: pnpm --filter ./packages/cli publish --dry-run --no-git-checks --access public

      # Provenance requires the `id-token: write` permission above. It records the
      # repository, commit and workflow that produced the tarball, so consumers can
      # verify the published package was built here and not on a laptop.
      - name: Publish
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry-run)
        run: pnpm --filter ./packages/cli publish --no-git-checks --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Kept in a separate job on purpose. This job never runs project code, so the
  # `contents: write` token it holds cannot be reached by a build script. GitHub
  # only accepts `permissions` on a workflow or a job, not on a step.
  release:
    name: Create GitHub release
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            See [CHANGELOG.md](https://github.com/higayes/apiforge/blob/main/CHANGELOG.md) for details.

            ```bash
            npm install -g @apiforge-tools/apiforge-cli@${{ github.ref_name }}
            ```
