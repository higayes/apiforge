name: Documentation issue
description: Something in the docs is wrong, missing or confusing
labels: [documentation, needs-triage]
body:
  - type: input
    id: location
    attributes:
      label: Where
      description: File path, URL or command whose `--help` is unclear.
    validations:
      required: true

  - type: textarea
    id: issue
    attributes:
      label: What is wrong
      description: Quote the current text and explain the problem.
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording
    validations:
      required: false
