openapi: 3.1.0
info:
  title: APIFORGE demo API
  version: 1.0.0
  description: >
    A trimmed description of the API served by scripts/demo-server.mjs. It is
    used to demonstrate `apiforge import` and schema-derived assertions.
servers:
  - url: http://127.0.0.1:4010
paths:
  /health:
    get:
      operationId: getHealth
      summary: Health probe
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  uptimeSeconds:
                    type: number
  /api/users:
    get:
      operationId: listUsers
      summary: List users
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        '200':
          description: A page of users
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  meta:
                    type: object
                    required: [page, limit, total]
                    properties:
                      page: { type: integer }
                      limit: { type: integer }
                      total: { type: integer }
    post:
      operationId: createUser
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUser'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  fields:
                    type: object
                    additionalProperties: { type: string }
  /api/users/{id}:
    get:
      operationId: getUser
      summary: Fetch one user
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  id: { type: integer }
components:
  schemas:
    User:
      type: object
      # `email` is optional: clients may create a user without one.
      required: [id, name, role, active]
      properties:
        id: { type: integer }
        name: { type: string, minLength: 1 }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, engineer, member] }
        active: { type: boolean }
    NewUser:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, engineer, member] }
